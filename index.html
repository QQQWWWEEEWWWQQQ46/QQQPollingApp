<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PollCraft - Single File Polling & Voting</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#18212f;--muted:#667085;--line:#dfe5ee;--primary:#4f46e5;--primary2:#4338ca;--danger:#dc2626;--ok:#15803d;--shadow:0 12px 30px rgba(24,33,47,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}h1{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:6px;background:#e9edf5;border-radius:12px;padding:4px}.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:9px;color:#475467}.tabs button.active{background:#fff;color:#111827;box-shadow:0 2px 8px #00000012}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.pad{padding:18px}.card h2{font-size:16px;margin:0 0 16px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#475467}.field input,.field textarea,.field select{width:100%;border:1px solid #cfd7e4;border-radius:10px;padding:10px 11px;background:#fff;color:#111827;outline:none}.field textarea{resize:vertical;min-height:74px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8b85ee;box-shadow:0 0 0 3px #4f46e51c}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750}.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary2)}.secondary{background:#eef2ff;color:#3730a3}.ghost{background:#f5f6f8;color:#344054}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1}.choice-editor{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center}.thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:#f0f2f5;border:1px dashed #cbd5e1}.thumb.empty{display:grid;place-items:center;color:#94a3b8;font-size:19px}.mini{font-size:11px;padding:6px 8px}.poll-list{max-height:520px;overflow:auto}.poll-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer}.poll-item:hover,.poll-item.active{border-color:#8b85ee;background:#f7f7ff}.poll-item strong{display:block;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.hero{padding:26px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fbfbff,#f3f0ff);border-radius:16px 16px 0 0}.hero h2{font-size:25px;margin:0 0 7px}.hero p{margin:0;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px}.choice{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:.15s;text-align:left;padding:0;color:inherit}.choice:hover{transform:translateY(-1px);border-color:#aba6f4}.choice.selected{border-color:var(--primary);box-shadow:0 0 0 3px #4f46e51f}.choice-img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block;background:#eef0f4}.choice-body{padding:13px;display:flex;gap:10px;align-items:center}.radio{width:18px;height:18px;border:2px solid #aab3c1;border-radius:50%;flex:none}.selected .radio{border:5px solid var(--primary)}.choice-title{font-weight:780}.vote-actions{padding:0 18px 18px}.notice{font-size:12px;color:var(--muted);margin-top:9px}.empty-state{padding:56px 20px;text-align:center;color:var(--muted)}.results{padding:18px}.result{margin-bottom:15px}.result-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6);border-radius:inherit}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.badge{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:#027a48}.hidden{display:none!important}.msg{padding:9px 11px;border-radius:9px;font-size:12px;margin:10px 0}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#991b1b}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}.small{font-size:11px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.tabs{width:100%}.tabs button{flex:1}.choices{grid-template-columns:1fr}.shell{padding:12px}}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#182231;--text:#f3f4f6;--muted:#a8b1c0;--line:#314055;--shadow:none}.tabs{background:#232f40}.tabs button{color:#aeb8c7}.tabs button.active{background:#334155;color:#fff}.field input,.field textarea,.field select,.choice{background:#111827;color:#f3f4f6;border-color:#3b4b60}.hero{background:linear-gradient(135deg,#1b2535,#251f45)}.poll-item:hover,.poll-item.active{background:#252547}.choice-img,.thumb{background:#263244}.ghost{background:#273548;color:#e5e7eb}.bar{background:#2a3749}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><div class="logo">P</div><div><h1>PollCraft</h1><div class="sub">Create polls, add optional images, vote, and view results.</div></div></div>
    <div class="tabs"><button id="tabVote" class="active">Voting Booth</button><button id="tabAdmin">Admin</button></div>
  </div>

  <section id="voteView">
    <div class="grid">
      <div class="card pad"><h2>Available polls</h2><div id="pollList" class="poll-list"></div></div>
      <div class="card" id="booth"><div class="empty-state">Create or select a poll to begin.</div></div>
    </div>
  </section>

  <section id="adminView" class="hidden">
    <div id="adminLock" class="card pad" style="max-width:430px;margin:auto">
      <h2>Admin access</h2>
      <div class="field"><label>Firebase admin email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="admin@example.com"></div>
      <div class="field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Firebase password"></div>
      <button class="btn primary" id="unlockBtn">Sign in</button>
      <div class="notice">Uses Firebase Authentication. Enable Email/Password and create an admin user in Firebase Console.</div><div id="lockMsg"></div>
    </div>
    <div id="adminPanel" class="grid hidden">
      <div class="card pad">
        <h2 id="formTitle">Create a poll</h2>
        <input id="editId" type="hidden">
        <div class="field"><label>Question / title</label><input id="question" maxlength="140" placeholder="e.g., Which design should we use?"></div>
        <div class="field"><label>Description (optional)</label><textarea id="description" maxlength="400" placeholder="Add context or instructions..."></textarea></div>
        <div class="field"><label>Voting mode</label><select id="mode"><option value="single">Single choice</option><option value="multiple">Multiple choices</option></select></div>
        <div class="row" style="margin-bottom:12px"><label class="small"><input type="checkbox" id="showResults" checked> Show results to voters after voting</label></div>
        <div class="row" style="margin-bottom:8px"><strong style="font-size:13px">Choices</strong><button class="btn secondary mini" id="addChoice" type="button">+ Add choice</button></div>
        <div id="choiceEditors"></div>
        <div id="formMsg"></div>
        <div class="row"><button class="btn primary grow" id="savePoll">Save poll</button><button class="btn ghost hidden" id="cancelEdit">Cancel</button></div>
      </div>
      <div class="card">
        <div class="toolbar"><strong>Manage polls</strong><div class="row"><button class="btn ghost mini" id="exportBtn">Export backup</button><label class="btn ghost mini filebtn">Import<input type="file" id="importFile" accept="application/json"></label></div></div>
        <div class="pad"><div class="row" style="justify-content:flex-end"><button class="btn ghost mini" id="signOutBtn">Sign out</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div id="manageList"></div></div>
      </div>
    </div>
  </section>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, runTransaction } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyCgSPUEXHryD6z1RpEiVfetQb4n7wNLTCs",authDomain:"qqqpollingapp.firebaseapp.com",databaseURL:"https://qqqpollingapp-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"qqqpollingapp",storageBucket:"qqqpollingapp.firebasestorage.app",messagingSenderId:"31032923212",appId:"1:31032923212:web:27fef8a20842d12a0350e9"};
const app=initializeApp(firebaseConfig), db=getDatabase(app), auth=getAuth(app);
let data={polls:[]}, selectedPoll=null, selected=new Set(), adminOpen=false, connected=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function msg(el,text,type='success'){el.innerHTML=`<div class="msg ${type}">${esc(text)}</div>`;setTimeout(()=>el.innerHTML='',3500)}
function pollsFromSnapshot(v){if(!v)return[];return Object.entries(v).map(([id,p])=>({id,...p,choices:p.choices?Object.entries(p.choices).map(([cid,c])=>({id:cid,...c,votes:Number(c.votes)||0})):[]})).sort((a,b)=>(b.created||0)-(a.created||0))}
function pollForDb(p){const choices={};p.choices.forEach(c=>choices[c.id]={text:c.text,image:c.image||'',votes:Number(c.votes)||0});return{question:p.question,description:p.description||'',mode:p.mode,showResults:p.showResults!==false,created:p.created||Date.now(),choices}}
onValue(ref(db,'polls'),snap=>{connected=true;data.polls=pollsFromSnapshot(snap.val());if(selectedPoll&&!data.polls.some(p=>p.id===selectedPoll))selectedPoll=null;renderPollList();renderManage();if(selectedPoll)renderBooth()},err=>{connected=false;showConnectionError(err.message)});
function showConnectionError(t){let n=$('firebaseError');if(!n){n=document.createElement('div');n.id='firebaseError';n.className='msg error';document.querySelector('.shell').insertBefore(n,document.querySelector('.top').nextSibling)}n.textContent='Firebase connection error: '+t+' Check Realtime Database rules and configuration.'}
function switchTab(which){$('voteView').classList.toggle('hidden',which!=='vote');$('adminView').classList.toggle('hidden',which!=='admin');$('tabVote').classList.toggle('active',which==='vote');$('tabAdmin').classList.toggle('active',which==='admin');if(which==='admin'&&adminOpen){renderManage();resetForm()}renderPollList()}
$('tabVote').onclick=()=>switchTab('vote');$('tabAdmin').onclick=()=>switchTab('admin');
$('unlockBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('adminEmail').value.trim(),$('adminPassword').value);$('adminPassword').value=''}catch(e){msg($('lockMsg'),e.message,'error')}};
$('signOutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{adminOpen=!!user;$('adminLock').classList.toggle('hidden',!!user);$('adminPanel').classList.toggle('hidden',!user);if(user){resetForm();renderManage()}});
function editor(choice={id:uid(),text:'',image:''}){const d=document.createElement('div');d.className='choice-editor';d.dataset.id=choice.id;d.dataset.image=choice.image||'';d.innerHTML=`${choice.image?`<img class="thumb" src="${choice.image}" alt="Choice preview">`:`<div class="thumb empty">+</div>`}<div><input class="choiceText" maxlength="100" value="${esc(choice.text)}" placeholder="Choice label" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"><div class="row" style="margin-top:6px"><label class="btn ghost mini filebtn">Image<input class="imgInput" type="file" accept="image/*"></label><button class="btn ghost mini rmImg" type="button">Clear image</button></div></div><button class="btn danger mini rmChoice" type="button">Remove</button>`;d.querySelector('.imgInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>700000){alert('Please use an image under 700 KB.');return}const r=new FileReader();r.onload=()=>{d.dataset.image=r.result;const old=d.querySelector('.thumb'),im=document.createElement('img');im.className='thumb';im.alt='Choice preview';im.src=r.result;old.replaceWith(im)};r.readAsDataURL(f)};d.querySelector('.rmImg').onclick=()=>{d.dataset.image='';const old=d.querySelector('.thumb'),x=document.createElement('div');x.className='thumb empty';x.textContent='+';old.replaceWith(x)};d.querySelector('.rmChoice').onclick=()=>{if($('choiceEditors').children.length<=2)return alert('A poll needs at least 2 choices.');d.remove()};$('choiceEditors').appendChild(d)}
$('addChoice').onclick=()=>editor();
function resetForm(){$('formTitle').textContent='Create a poll';$('editId').value='';$('question').value='';$('description').value='';$('mode').value='single';$('showResults').checked=true;$('choiceEditors').innerHTML='';editor();editor();$('cancelEdit').classList.add('hidden')}
$('cancelEdit').onclick=resetForm;
const collectChoices=()=>[...$('choiceEditors').children].map(d=>({id:d.dataset.id||uid(),text:d.querySelector('.choiceText').value.trim(),image:d.dataset.image||''}));
$('savePoll').onclick=async()=>{const q=$('question').value.trim(),choices=collectChoices();if(!q)return msg($('formMsg'),'Add a poll question.','error');if(choices.length<2||choices.some(c=>!c.text))return msg($('formMsg'),'Add at least 2 labeled choices.','error');const id=$('editId').value||uid(),existing=data.polls.find(p=>p.id===id);const poll={id,question:q,description:$('description').value.trim(),mode:$('mode').value,showResults:$('showResults').checked,created:existing?.created||Date.now(),choices:choices.map(c=>({...c,votes:existing?.choices.find(x=>x.id===c.id)?.votes||0}))};try{await set(ref(db,'polls/'+id),pollForDb(poll));msg($('formMsg'),existing?'Poll updated.':'Poll created.');setTimeout(resetForm,500)}catch(e){msg($('formMsg'),e.message,'error')}};
function renderPollList(){const el=$('pollList');if(!data.polls.length){el.innerHTML=`<div class="empty-state" style="padding:30px 8px">${connected?'No polls yet.':'Connecting to Firebase...'}</div>`;return}el.innerHTML=data.polls.map(p=>`<div class="poll-item ${p.id===selectedPoll?'active':''}" data-id="${p.id}"><strong>${esc(p.question)}</strong><div class="meta">${p.choices.reduce((a,c)=>a+c.votes,0)} total votes · ${p.mode==='multiple'?'Multiple':'Single'} choice</div></div>`).join('');el.querySelectorAll('.poll-item').forEach(x=>x.onclick=()=>{selectedPoll=x.dataset.id;selected.clear();renderPollList();renderBooth()})}
function renderBooth(){const p=data.polls.find(x=>x.id===selectedPoll),el=$('booth');if(!p){el.innerHTML='<div class="empty-state">Select a poll to begin.</div>';return}el.innerHTML=`<div class="hero"><span class="badge">Live on Firebase</span><h2>${esc(p.question)}</h2><p>${esc(p.description||'Select your choice below.')}</p></div><div class="choices">${p.choices.map(c=>`<button class="choice" data-id="${c.id}">${c.image?`<img class="choice-img" src="${c.image}" alt="${esc(c.text)}">`:''}<div class="choice-body"><span class="radio"></span><span class="choice-title">${esc(c.text)}</span></div></button>`).join('')}</div><div class="vote-actions"><button class="btn primary" id="submitVote" disabled>Submit vote</button><div class="notice">${p.mode==='multiple'?'You may select more than one choice.':'Select one choice.'} Votes are shared live through Firebase.</div><div id="voteMsg"></div></div>`;el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(p.mode==='single')selected.clear();selected.has(b.dataset.id)?selected.delete(b.dataset.id):selected.add(b.dataset.id);el.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',selected.has(x.dataset.id)));$('submitVote').disabled=!selected.size});$('submitVote').onclick=async()=>{const btn=$('submitVote');btn.disabled=true;try{await Promise.all([...selected].map(id=>runTransaction(ref(db,`polls/${p.id}/choices/${id}/votes`),v=>(Number(v)||0)+1)));selected.clear();p.showResults?renderResults(data.polls.find(x=>x.id===p.id)||p):renderThanks(p)}catch(e){msg($('voteMsg'),e.message,'error');btn.disabled=false}}}
function renderResults(p){const total=p.choices.reduce((a,c)=>a+c.votes,0);$('booth').innerHTML=`<div class="hero"><span class="badge">Vote recorded</span><h2>${esc(p.question)}</h2><p>Live results</p></div><div class="results">${p.choices.map(c=>{const pct=total?Math.round(c.votes/total*100):0;return`<div class="result"><div class="result-head"><b>${esc(c.text)}</b><span>${c.votes} · ${pct}%</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`}).join('')}<button class="btn ghost" id="backPoll">Back to poll</button></div>`;$('backPoll').onclick=renderBooth}
function renderThanks(p){$('booth').innerHTML=`<div class="empty-state"><h2>Vote recorded</h2><p>Thank you for voting in “${esc(p.question)}”.</p><button class="btn ghost" id="backPoll">Back</button></div>`;$('backPoll').onclick=renderBooth}
function renderManage(){const el=$('manageList');if(!el||!adminOpen)return;if(!data.polls.length){el.innerHTML='<div class="empty-state" style="padding:30px 8px">No polls created yet.</div>';return}el.innerHTML=data.polls.map(p=>`<div class="poll-item"><strong>${esc(p.question)}</strong><div class="meta">${p.choices.reduce((a,c)=>a+c.votes,0)} votes · ${p.choices.length} choices</div><div class="row" style="margin-top:9px"><button class="btn secondary mini edit" data-id="${p.id}">Edit</button><button class="btn ghost mini reset" data-id="${p.id}">Reset votes</button><button class="btn danger mini del" data-id="${p.id}">Delete</button></div></div>`).join('');el.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editPoll(b.dataset.id));el.querySelectorAll('.reset').forEach(b=>b.onclick=async()=>{if(confirm('Reset all votes for this poll?'))await Promise.all(data.polls.find(x=>x.id===b.dataset.id).choices.map(c=>set(ref(db,`polls/${b.dataset.id}/choices/${c.id}/votes`),0)))});el.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(confirm('Delete this poll permanently?'))await remove(ref(db,'polls/'+b.dataset.id))})}
function editPoll(id){const p=data.polls.find(x=>x.id===id);if(!p)return;$('formTitle').textContent='Edit poll';$('editId').value=p.id;$('question').value=p.question;$('description').value=p.description||'';$('mode').value=p.mode;$('showResults').checked=p.showResults!==false;$('choiceEditors').innerHTML='';p.choices.forEach(c=>editor(c));$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pollcraft-firebase-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.polls))throw 0;for(const p of x.polls)await set(ref(db,'polls/'+(p.id||uid())),pollForDb(p));alert('Backup imported.')}catch{alert('Invalid PollCraft backup file or Firebase permission denied.')}};r.readAsText(f);e.target.value=''};
renderPollList();
</script>
</body>
</html>
